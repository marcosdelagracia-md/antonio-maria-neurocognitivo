<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antônio × Maria | Raciocínio Clínico</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 30px;
      background: #1e293b;
      color: #93c5fd;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 72px);
      margin: 0 0 16px;
      line-height: 1;
    }

    .versus {
      color: #60a5fa;
    }

    h2 {
      font-size: 22px;
      font-weight: normal;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      font-size: 17px;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 28px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .rodape {
      margin-top: 50px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="tag">
      DESAFIO CLÍNICO
    </div>

    <h1>
      ANTÔNIO <span class="versus">×</span> MARIA
    </h1>

    <h2>
      Diagnóstico diferencial nos transtornos neurocognitivos
    </h2>

    <p>
      Analise as informações clínicas, formule hipóteses e acompanhe
      como novas evidências podem modificar o seu raciocínio.
    </p>

    <button type="button">
      CONHECER OS CASOS
    </button>

    <div class="rodape">
      Atividade acadêmica • Avaliação Psicológica na Velhice
    </div>

  </main>

</body>

</html>
